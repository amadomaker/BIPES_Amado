<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>EasyMQTT</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      iframe {
        border: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <iframe id="easymqttIframe" src=""></iframe>

    <script>
      const params = new URLSearchParams(window.location.search);
      const session = params.get("session");

      const iframe = document.getElementById("easymqttIframe");

      // Aponta diretamente para o servidor que interpreta o PHP
      const baseURL = "https://staging.dblocks.com.br/easymqtt";

      if (session) {
        iframe.src = `${baseURL}/index.html?session=${session}`;
      } else {
        iframe.src = `${baseURL}/index.html`;
        console.warn("Session ID not provided");
      }
    </script>
  </body>
</html>
