# Minimal secure-ish Mosquitto config for GCE VM

# Listen on all interfaces at 1883 (plain TCP)
listener 1883 0.0.0.0

# Authentication
password_file /mosquitto/config/passwd
allow_anonymous false

# Optional: per-topic ACL file (uncomment if you create one)
# acl_file /mosquitto/config/acl

# Persistence/logs
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
