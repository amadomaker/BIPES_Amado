version: "3.9"

services:
  mqtt:
    image: eclipse-mosquitto:2.0.21
    container_name: mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - mosq-data:/mosquitto/data
      - mosq-log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mosquitto_sub -h 127.0.0.1 -p 1883 -t \$SYS/broker/version -C 1 -W 3 || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  subscriber:
    image: us-central1-docker.pkg.dev/erudite-nation-440421-p7/dblocks/subscriber:v2
    container_name: subscriber
    depends_on:
      - mqtt
    restart: unless-stopped
    environment:
      - MQTT_HOST=mqtt
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - MONGO_URI=${MONGO_URI}

volumes:
  mosq-data: {}
  mosq-log: {}
