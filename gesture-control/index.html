<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle por Gestos</title>
  <link rel="stylesheet" href="gesture-control.css">
</head>
<body>

  <div id="overlay" class="hidden">
    <div class="spinner"></div>
    <span id="overlayMsg">Carregando...</span>
  </div>

  <!-- ── Top bar ── -->
  <div class="topbar">
    <span class="topbar-title">🤖 Controle por Gestos</span>

    <div class="ip-group">
      <label for="ipInput">ESP32 IP:</label>
      <input type="text" id="ipInput" placeholder="192.168.1.100" autocomplete="off" spellcheck="false">
      <button class="btn btn-save" id="btnSave">Salvar</button>
    </div>

    <div id="statusChip" class="status-chip">
      <span class="dot"></span>
      <span id="statusText">Não configurado</span>
    </div>

    <div class="spacer"></div>

    <button class="btn btn-cam-on"  id="btnStart">▶ Ligar Câmera</button>
    <button class="btn btn-cam-off" id="btnStop" disabled>■ Desligar</button>
  </div>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Painel de vídeo -->
    <div class="video-panel">
      <div class="camera-placeholder" id="placeholder">
        <span class="cam-icon">📷</span>
        <p>Clique em <strong>Ligar Câmera</strong> para começar</p>
      </div>
      <video id="videoEl" autoplay muted playsinline style="display:none;"></video>

      <div class="gesture-live">
        <div class="live-label">Gesto detectado</div>
        <span class="live-emoji" id="liveEmoji">—</span>
        <div class="live-name none" id="liveName">Aguardando...</div>
        <div class="live-conf" id="liveConf"></div>
        <div class="sending-flash" id="sendFlash"></div>
      </div>
    </div>

    <!-- Cards de gestos -->
    <div class="cards-panel">
      <div class="cards-header">Mapeie cada gesto a um comando HTTP do seu ESP32</div>
      <div class="cards-grid" id="cardsGrid">
        <!-- preenchido por JS -->
      </div>
    </div>

  </div>

  <script type="module" src="gesture-control.js"></script>
</body>
</html>
