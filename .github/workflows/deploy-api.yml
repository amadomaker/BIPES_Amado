name: Deploy API to Cloud Run

on:
  push:
    branches: [master, staging]
    paths:
      - "easymqtt/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: erudite-nation-440421-p7
  REGION: us-central1
  REPO: dblocks
  IMAGE: api

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Set environment variables
        run: |
          TAG="${GITHUB_SHA:0:8}"
          echo "TAG=$TAG" >> $GITHUB_ENV

          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "ENV_SUFFIX=" >> $GITHUB_ENV
            echo "PUBLISHER_URL=https://mqtt-publisher-tgtka7akja-uc.a.run.app" >> $GITHUB_ENV
            echo "🚀 Production environment detected"
          else
            echo "ENV_SUFFIX=-staging" >> $GITHUB_ENV
            echo "PUBLISHER_URL=https://mqtt-publisher-staging-tgtka7akja-uc.a.run.app" >> $GITHUB_ENV
            echo "🧪 Staging environment detected"
          fi

          echo "PUBLISHER_URL will be set to: $PUBLISHER_URL"

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ env.TAG }}"

          docker build -t $IMAGE_URI -f easymqtt/Dockerfile easymqtt
          docker push $IMAGE_URI

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying with PUBLISHER_URL: ${{ env.PUBLISHER_URL }}"
          gcloud run deploy bipes-api${{ env.ENV_SUFFIX }} \
            --image=${{ env.IMAGE_URI }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars="PUBLISHER_URL=${{ env.PUBLISHER_URL }}" \
            --timeout=300

      - name: Get Service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe bipes-api${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ API deployed: $SERVICE_URL"

      - name: Test API Health
        run: |
          sleep 30  # Wait for deployment
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.service-url.outputs.url }}/")
          if [[ "$RESPONSE" == "200" ]]; then
            echo "✅ API health check passed"
          else
            echo "❌ API health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Test Publish Endpoint
        run: |
          echo "Testing publish endpoint with PUBLISHER_URL: ${{ env.PUBLISHER_URL }}"

          # Test environment variable visibility
          echo "Testing if container can see PUBLISHER_URL..."
          ENV_TEST=$(curl -s "${{ steps.service-url.outputs.url }}/test-env.php" || echo "test-env.php not found")
          echo "Environment test: $ENV_TEST"

          # First test the Cloud Function directly
          echo "Testing Cloud Function directly..."
          CF_RESPONSE=$(curl -s "${{ env.PUBLISHER_URL }}?session=ci-test&topic=api-health&value=42")
          echo "Cloud Function response: $CF_RESPONSE"

          # Now test through API
          echo "Testing through API..."
          RESPONSE=$(curl -s "${{ steps.service-url.outputs.url }}/publish.php?session=ci-test&topic=api-health&value=42")
          echo "Publish test response: $RESPONSE"

          # More flexible success check
          if echo "$RESPONSE" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "✅ Publish endpoint test passed"
          elif echo "$RESPONSE" | grep -q '"success"[[:space:]]*:[[:space:]]*false'; then
            echo "⚠️  Publish endpoint returned error (check MQTT connectivity)"
            echo "This might be expected if MQTT broker is not accessible"
            # Don't fail the pipeline for MQTT connectivity issues
          else
            echo "❌ Publish endpoint test failed - unexpected response format"
            exit 1
          fi
