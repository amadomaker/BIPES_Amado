name: VM Setup Documentation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for VM setup"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  vm-setup-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: VM Setup Instructions
        run: |
          echo "🖥️ **VM Setup Instructions**"
          echo ""
          echo "The MQTT broker and subscriber run on a VM that needs manual setup."
          echo "Follow these steps to configure the VM:"
          echo ""
          echo "## 1. Create VM (if not exists)"
          echo "\`\`\`bash"
          echo "gcloud compute instances create bipes-mqtt-vm \\"
          echo "  --zone=us-central1-a \\"
          echo "  --machine-type=e2-micro \\"
          echo "  --boot-disk-size=10GB \\"
          echo "  --boot-disk-type=pd-standard \\"
          echo "  --image-family=debian-12 \\"
          echo "  --image-project=debian-cloud \\"
          echo "  --tags=mqtt-server"
          echo "\`\`\`"
          echo ""
          echo "## 2. Configure Firewall"
          echo "\`\`\`bash"
          echo "gcloud compute firewall-rules create allow-mqtt \\"
          echo "  --allow tcp:1883 \\"
          echo "  --source-ranges 0.0.0.0/0 \\"
          echo "  --target-tags mqtt-server"
          echo "\`\`\`"
          echo ""
          echo "## 3. SSH into VM and setup"
          echo "\`\`\`bash"
          echo "gcloud compute ssh bipes-mqtt-vm --zone=us-central1-a"
          echo ""
          echo "# Inside VM:"
          echo "sudo apt update"
          echo "sudo apt install -y docker.io docker-compose git"
          echo "sudo usermod -aG docker \$USER"
          echo "sudo systemctl enable docker"
          echo "sudo systemctl start docker"
          echo ""
          echo "# Clone repo"
          echo "git clone https://github.com/amadomaker/BIPES_Amado.git"
          echo "cd BIPES_Amado/infra/gce-mqtt"
          echo ""
          echo "# Setup environment"
          echo "cp .env.example .env"
          echo "# Edit .env with your credentials"
          echo "nano .env"
          echo ""
          echo "# Generate mosquitto password file"
          echo "docker run --rm -v \$(pwd):/work -w /work eclipse-mosquitto:2.0.21 \\"
          echo "  sh -lc \"mosquitto_passwd -c passwd bipes\""
          echo ""
          echo "# Start services"
          echo "docker compose up -d"
          echo "\`\`\`"
          echo ""
          echo "## 4. Verify Services"
          echo "\`\`\`bash"
          echo "docker compose ps"
          echo "docker logs mqtt -f"
          echo "docker logs subscriber -f"
          echo "\`\`\`"
          echo ""
          echo "## 5. Test MQTT"
          echo "\`\`\`bash"
          echo "# Install mosquitto clients for testing"
          echo "sudo apt install mosquitto-clients"
          echo ""
          echo "# Test publish"
          echo "mosquitto_pub -h 127.0.0.1 -p 1883 -u bipes -P YOUR_PASSWORD \\"
          echo "  -t \"test/topic\" -m \"hello world\""
          echo ""
          echo "# Test subscribe"
          echo "mosquitto_sub -h 127.0.0.1 -p 1883 -u bipes -P YOUR_PASSWORD \\"
          echo "  -t \"#\" -v"
          echo "\`\`\`"
          echo ""
          echo "## 6. Get VM External IP"
          echo "\`\`\`bash"
          echo "gcloud compute instances describe bipes-mqtt-vm \\"
          echo "  --zone=us-central1-a \\"
          echo "  --format=\"get(networkInterfaces[0].accessConfigs[0].natIP)\""
          echo "\`\`\`"
          echo ""
          echo "⚠️ **Important:** Update the IP in your secrets and code:"
          echo "- GitHub Secrets: PROD_MQTT_HOST / STAGING_MQTT_HOST"
          echo "- ui/core/generator_stubs.js (if hardcoded)"
          echo ""
          echo "📋 **Files to check after VM setup:**"
          echo "- infra/gce-mqtt/.env"
          echo "- infra/gce-mqtt/passwd"
          echo "- VM external IP in GitHub secrets"
