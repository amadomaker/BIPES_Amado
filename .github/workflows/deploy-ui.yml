name: Deploy UI

on:
  push:
    branches: [master, staging]
    paths:
      - "ui/**"
      - "Simulator/**"
      - "easymqtt/**"
      - "gesture-control/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGION: us-central1
  REPO: dblocks
  SERVICE: bipes-ui

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/master' || github.event.inputs.environment == 'production') && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "PROJECT_ID=${{ secrets.PROD_PROJECT_ID }}" >> $GITHUB_ENV
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
          else
            echo "PROJECT_ID=${{ secrets.STAGING_PROJECT_ID }}" >> $GITHUB_ENV
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
          fi
          echo "TAG=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Generate version.json
        run: |
          cat > ui/version.json << EOF
          {
            "version": "$(cat VERSION 2>/dev/null || echo '1.0.0')",
            "env": "${{ env.DEPLOY_ENV }}",
            "commit": "${{ env.TAG }}",
            "branch": "${{ github.ref_name }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Build and push image
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/ui:${{ env.TAG }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update Cloud Run image
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.IMAGE }}

      - name: Health check
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "Deployed to: $URL"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL/ui/index.html")
          if [[ "$HTTP" == "200" ]]; then
            echo "✅ Health check passed (HTTP $HTTP)"
          else
            echo "❌ Health check failed (HTTP $HTTP)"
            exit 1
          fi
