name: Build UI

on:

  push:
    branches: 
      - feat/deploy-gcp

  # pull_request:
  #   branches: [ staging, master ]
  #   types: [closed]  # Só roda quando um PR é mergeado

env:
  ENVIROMENT: "staging" 

jobs:
  deploy:
    # if: github.event.pull_request.merged == true
    name: Deploy para Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Modules Check
        run: git submodule status

      - name: Atualizar Submódulos Específicos
        run: git submodule update --init --recursive ui/freeboard

      - name: Auth with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configuration to Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configuration Docker to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Environment Check
        run: |
          if [[ "ENVIROMENT" == "master" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "SERVICE_NAME=dblocks-ui-prod" >> $GITHUB_ENV
          else
            echo "ENV=staging" >> $GITHUB_ENV
            echo "SERVICE_NAME=dblocks-ui-staging" >> $GITHUB_ENV
          fi

      - name: Build in Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/${{ env.SERVICE_NAME }}:${{ github.run_number }} .

      - name: Push the Docker image
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/${{ env.SERVICE_NAME }}:${{ github.run_number }}

      - name: Deploy in Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/${{ env.SERVICE_NAME }}:${{ github.run_number }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated