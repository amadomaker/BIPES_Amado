name: Build and Deploy Pub/Sub

on:

  push:
    branches: 
      - feat/deploy-gcp

  # pull_request: 
  #       branches: [ staging, master ]
  #       types: [closed]

jobs:
  build:
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticação no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/publisher:${{ github.run_number }} -f easymqtt/publisher/Dockerfile .
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/subscriber:${{ github.run_number }} ./easymqtt/server

      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/publisher:${{ github.run_number }}
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dblocks/subscriber:${{ github.run_number }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy on remote VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" > .env
            echo "TAG_SUBS=${{ github.run_number }}" >> .env
            echo "TAG_TAG_PUBLIS=${{ github.run_number }}" >> .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "MQTT_HOST=${{ secrets.MQTT_HOST }}" >> .env
            echo "MQTT_USER=${{ secrets.MQTT_USER }}" >> .env
            echo "MQTT_PASS=${{ secrets.MQTT_PASS }}" >> .env

            echo "Stopping old container..."
            docker compose stop

            export TAG_PUBLIS=${{ github.run_number }}
            export TAG_SUBS=${{ github.run_number }}

            echo "Pulling latest image..."
            docker compose pull

            echo "Starting new container..."
            docker compose up -d